# `github-bridge` — the fleet's GitHub↔board bridge adapter daemon (design #141, task #136).
#
# This is the SECOND adapter over the shared external-bridge core (Slack is the first, `crates/slack-bridge`):
# GitHub issues mirror IN to board tasks, GitHub issue comments sync in attributed to their GitHub authors,
# and an authorized board task comment reflects OUT onto the GitHub issue under policy. The board owns the
# bridge CORE (external-identity, external-links, outbound-reflect authz — board tasks #149/#150/#151); this
# crate is TRANSPORT + SYNC only and CONSUMES those primitives, never reimplements them. GitHub-specifics
# stay in this crate so the shared concerns live once on the board (see `crates/slack-bridge` for the sibling).
#
# The crate is a workspace member so `cargo test` at the workspace root gates its pure core (config
# resolution, firehose parsing, issue↔task link mapping, attributed-post/identity body building). The live
# daemon binary (the GitHub REST poller + board firehose loop) is added in a later slice behind a feature so
# it never enters the default `cargo test` / `nix flake check`.
[package]
name = "github-bridge"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "github_bridge"
path = "src/lib.rs"

# The daemon binary — a thin blocking poll loop wiring the tested lib together. Gated behind
# `required-features = ["daemon"]` so the default `cargo test --workspace` / `nix flake check` never build it
# or compile its clap/tracing tree. Build/run it with `--features daemon`.
[[bin]]
name = "github-bridge"
path = "src/main.rs"
required-features = ["daemon"]

[features]
# The live daemon: CLI parsing + structured logging. Off by default; the lib (and its tests) never need it.
daemon = ["dep:clap", "dep:tracing", "dep:tracing-subscriber"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The daemon's config format: a single TOML file (operator mandate #159 — no env-var config). Holds the
# GitHub token + wiring; delivered at deploy time as the agenix-decrypted secret, gitignored in dev.
toml = "0.8"
# Minimal blocking HTTP client for BOTH sides: the board's token-less localhost REST (firehose poll +
# task/comment writes) and the GitHub REST API (HTTPS via ureq's default rustls TLS). Light + blocking, so
# the whole bridge stays a plain poll loop with no heavy async tree (unlike Slack's Socket Mode transport).
ureq = "2"

# ── The daemon binary's shell — OPTIONAL, pulled only by the `daemon` feature (see above). ──
# `--config <path>` CLI flag (the ONLY thing chosen outside the TOML file; mandate #159).
clap = { version = "4", features = ["derive"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
