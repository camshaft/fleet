# prose-style.toml -- the clean-prose lint ruleset (task_1319).
#
# `emphatics` is a checked-in projection of the live board banned-phrases list, which is the one
# authoritative source. It is meant to be regenerated by `fleet prose-sync` (a later slice adds the
# sync plus a drift check that fails when this file falls behind the board); until then it is a
# hand-seeded copy of the board list and should be refreshed rather than edited by hand. The lint
# reads this file so the gate runs in public CI and in a pre-commit hook, neither of which can reach
# the internal board.
#
# `caps_allow` is the structural caps-for-emphasis rule's allow-list of acceptable all-caps tokens
# (acronyms and the like). It is kept conservative and extended from real false positives. A token
# that carries a digit or an underscore is treated as an identifier and is never flagged, so it does
# not belong here.

